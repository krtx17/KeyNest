amily="Inter,Arial" font-size="12" font-weight="600" fill="#635bdb">Reveal</text><rect x="790" y="520" width="63" height="38" rx="10" fill="#635bdb"/><text x="821" y="544" text-anchor="middle" font-family="Inter,Arial" font-size="12" font-weight="600" fill="#fff">Copy</text><path d="M326 580H876" stroke="#edf0f4"/><text x="326" y="621" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#8992a3">NOTES</text><text x="326" y="650" font-family="Inter,Arial" font-size="14" fill="#465168">Primary brand account. Use the team workspace role</text><text x="326" y="672" font-family="Inter,Arial" font-size="14" fill="#465168">when assigning posting access.</text><rect x="326" y="700" width="147" height="27" rx="13" fill="#f1f0ff"/><text x="399" y="718" text-anchor="middle" font-family="Inter,Arial" font-size="11" font-weight="600" fill="#5c54cf">Orbit Startup</text><rect x="932" y="258" width="306" height="258" rx="18" fill="#fff" stroke="#e5e9f0"/><text x="960" y="298" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#202a3d">Shared with</text><text x="960" y="324" font-family="Inter,Arial" font-size="12" fill="#8992a3">People with access to this login</text><circle cx="980" cy="366" r="17" fill="#dff5f0"/><text x="980" y="371" text-anchor="middle" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#158c75">MP</text><text x="1008" y="362" font-family="Inter,Arial" font-size="13" font-weight="600" fill="#343d52">Maya Patel</text><text x="1008" y="381" font-family="Inter,Arial" font-size="11" fill="#8992a3">Owner</text><circle cx="980" cy="414" r="17" fill="#fff0df"/><text x="980" y="419" text-anchor="middle" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#c17a2f">AS</text><text x="1008" y="410" font-family="Inter,Arial" font-size="13" font-weight="600" fill="#343d52">Arjun Shah</text><text x="1008" y="429" font-family="Inter,Arial" font-size="11" fill="#8992a3">Can view &amp; copy</text><rect x="960" y="458" width="250" height="38" rx="10" fill="#f4f3ff"/><text x="1085" y="482" text-anchor="middle" font-family="Inter,Arial" font-size="12" font-weight="600" fill="#635bdb">＋  Manage access</text><rect x="932" y="536" width="306" height="128" rx="16" fill="#fff8eb" stroke="#f5e7c9"/><circle cx="960" cy="567" r="12" fill="#fae6bd"/><text x="960" y="572" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#a66a10">!</text><text x="981" y="571" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#76531b">Sharing reminder</text><text x="956" y="600" font-family="Inter,Arial" font-size="12" fill="#806f50">Removing access cannot erase a password</text><text x="956" y="619" font-family="Inter,Arial" font-size="12" fill="#806f50">someone has already copied. Rotate it when</text><text x="956" y="638" font-family="Inter,Arial" font-size="12" fill="#806f50">a teammate leaves.</text></svg>
