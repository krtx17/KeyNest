<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
      .card-highlight { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; rx: 12; }
      .card-secure { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; rx: 12; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .sec-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 1px; text-transform: uppercase; }
      .tbl-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .field { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #334155; }
      .field-meta { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #475569; }
      .field-enc { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 600; fill: #6d28d9; }
      .badge-cipher { fill: #ede9fe; stroke: #ddd6fe; stroke-width: 1; rx: 4; }
      .badge-cipher-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #6d28d9; }
      .badge-meta { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .badge-meta-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #475569; }
      .arrow { stroke: #6366f1; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" class="bg" rx="16" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <circle cx="16" cy="16" r="16" fill="#6366f1" />
    <path d="M11 16h10 M16 11v10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="44" y="16" class="title">Keynest — Vault &amp; Cryptographic Data Model</text>
    <text x="44" y="34" class="subtitle">Plaintext Metadata vs. Authenticated Envelope Ciphertext</text>
  </g>

  <!-- Left Column: User & Workspace Hierarchy -->
  <g transform="translate(40, 95)">
    <text x="0" y="15" class="sec-hdr">Vault &amp; Membership Hierarchy</text>

    <!-- Users Table -->
    <rect x="0" y="25" width="260" height="110" class="card" />
    <text x="16" y="48" class="tbl-title">users</text>
    <text x="16" y="68" class="field">• id: UUID (PK)</text>
    <text x="16" y="86" class="field">• email: VARCHAR (Unique)</text>
    <text x="16" y="104" class="field">• password_hash: Scrypt Salted</text>
    <text x="16" y="122" class="field">• totp_secret: Encrypted (Optional)</text>

    <!-- Workspaces Table -->
    <rect x="0" y="150" width="260" height="130" class="card" />
    <text x="16" y="173" class="tbl-title">workspaces &amp; categories</text>
    <text x="16" y="193" class="field">• id: UUID (PK)</text>
    <text x="16" y="211" class="field">• kind: 'personal' | 'team'</text>
    <text x="16" y="229" class="field">• name: VARCHAR ("Orbit Startup")</text>
    <text x="16" y="247" class="field">• category_id: "Instagram", "Work"...</text>
    <text x="16" y="265" class="field">• owner_id: UUID (FK -&gt; users)</text>

    <!-- Memberships Table -->
    <rect x="0" y="295" width="260" height="115" class="card" />
    <text x="16" y="318" class="tbl-title">memberships</text>
    <text x="16" y="338" class="field">• id: UUID (PK)</text>
    <text x="16" y="356" class="field">• workspace_id: UUID (FK)</text>
    <text x="16" y="374" class="field">• user_id: UUID (FK)</text>
    <text x="16" y="392" class="field">• role: 'owner' | 'admin' | 'member'</text>
  </g>

  <!-- Middle Column: Encrypted Item Envelope -->
  <g transform="translate(330, 95)">
    <text x="0" y="15" class="sec-hdr">Vault Item Storage Boundary</text>

    <!-- Items Table -->
    <rect x="0" y="25" width="340" height="385" class="card" />
    <text x="20" y="52" class="tbl-title">items (Encrypted Vault Items)</text>

    <!-- Plaintext Metadata Section -->
    <rect x="20" y="68" width="300" height="125" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="30" y="78" width="130" height="18" class="badge-meta" />
    <text x="95" y="90" text-anchor="middle" class="badge-meta-txt">PLAINTEXT METADATA</text>
    <text x="30" y="115" class="field-meta">• id: UUID (PK)</text>
    <text x="30" y="133" class="field-meta">• workspace_id: UUID (Tenant partition)</text>
    <text x="30" y="151" class="field-meta">• type: 'login'</text>
    <text x="30" y="169" class="field-meta">• revision: INT (Optimistic lock count)</text>
    <text x="30" y="183" class="field-meta">• updated_at: TIMESTAMP</text>

    <!-- Encrypted Payload Section -->
    <rect x="20" y="205" width="300" height="185" rx="8" class="card-highlight" />
    <rect x="30" y="215" width="150" height="18" class="badge-cipher" />
    <text x="105" y="227" text-anchor="middle" class="badge-cipher-txt">AEAD OPAQUE CIPHERTEXT</text>
    <text x="30" y="252" class="field-enc">• payload_enc: TEXT</text>
    <text x="45" y="270" class="comp-sub" fill="#6d28d9">↳ Encrypted: password, username, url, notes</text>
    <text x="30" y="292" class="field-enc">• nonce: VARCHAR(64) (Unique IV)</text>
    <text x="30" y="312" class="field-enc">• enc_version: INT (Cipher format)</text>
    <text x="30" y="332" class="field-enc">• key_version: INT (Rotation counter)</text>
    <text x="30" y="352" class="field-enc">• deleted_at: TIMESTAMP (Tombstone)</text>
    <text x="30" y="375" class="comp-sub" fill="#15803d">✓ Zero plaintext passwords on server</text>
  </g>

  <!-- Right Column: Key Envelope & Sharing -->
  <g transform="translate(700, 95)">
    <text x="0" y="15" class="sec-hdr">Key Envelope &amp; Access Delegation</text>

    <!-- Item Keys Table -->
    <rect x="0" y="25" width="220" height="190" class="card-secure" />
    <text x="16" y="52" class="tbl-title">item_keys</text>
    <text x="16" y="74" class="field">• id: UUID (PK)</text>
    <text x="16" y="94" class="field">• item_id: UUID (FK)</text>
    <text x="16" y="114" class="field">• recipient_user_id: UUID</text>
    <text x="16" y="134" class="field" fill="#047857">• wrapped_key: TEXT</text>
    <text x="26" y="150" class="comp-sub" fill="#047857">↳ DEK wrapped for recipient</text>
    <text x="16" y="170" class="field">• permission:</text>
    <text x="26" y="186" class="comp-sub">'view_copy' | 'edit'</text>
    <text x="16" y="204" class="field">• revoked_at: TIMESTAMP</text>

    <!-- Sharing Notice -->
    <rect x="0" y="230" width="220" height="180" rx="12" fill="#fffbeb" stroke="#fde68a" />
    <text x="16" y="255" class="tbl-title" fill="#b45309">Access Boundary</text>
    <text x="16" y="278" class="comp-sub" fill="#92400e">• view_copy:</text>
    <text x="26" y="294" class="comp-sub" fill="#92400e">Can decrypt &amp; copy login.</text>
    <text x="16" y="318" class="comp-sub" fill="#92400e">• edit:</text>
    <text x="26" y="334" class="comp-sub" fill="#92400e">Can modify &amp; commit updates.</text>
    <text x="16" y="358" class="comp-sub" fill="#92400e">• Revocation:</text>
    <text x="26" y="374" class="comp-sub" fill="#92400e">Stops future access, but</text>
    <text x="26" y="390" class="comp-sub" fill="#92400e">cannot erase seen passwords.</text>
  </g>

  <!-- Connectors between Tables -->
  <path d="M 260 215 L 330 215" class="arrow" />
  <path d="M 670 120 L 700 120" class="arrow" />
</svg>
